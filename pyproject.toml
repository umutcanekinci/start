[project]
name = "hunted"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pygame-core",
]

[dependency-groups]
# Tooling for producing distributable builds (see hunted.spec / CI).
build = [
    "pyinstaller>=6.0",
]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv.sources]
pygame-core = { path = "src/pygame_core", editable = true }

[tool.pytest.ini_options]
# Puts src/ + src/pygame_core on sys.path so tests can `import entities` /
# `import combat` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygame_core"]
testpaths = ["tests"]

[tool.coverage.run]
# pygame_core is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. "src" alone finds the flat top-level files (game.py, entities.py,
# ...) but coverage.py's static discovery of *unexecuted* files doesn't
# reliably recurse into subdirectories, so src/util is listed separately.
source = ["src", "src/util"]
