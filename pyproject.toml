[project]
name = "hunted"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
]

[dependency-groups]
# Tooling for producing distributable builds (see hunted.spec / CI).
build = [
    "pyinstaller>=6.0",
]
dev = ["pytest>=8"]

[tool.uv.sources]
pygame-core = { path = "src/pygame_core", editable = true }

[tool.pytest.ini_options]
# Puts src/ + src/pygame_core on sys.path so tests can `import entities` /
# `import combat` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygame_core"]
testpaths = ["tests"]
