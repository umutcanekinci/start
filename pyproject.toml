[project]
name = "hunted"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pygamine",
]

[dependency-groups]
# Tooling for producing distributable builds (see hunted.spec / CI).
build = [
    "pyinstaller>=6.0",
]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv.sources]
pygamine = { path = "src/pygamine", editable = true }

[tool.pytest.ini_options]
# Puts src/ + src/pygamine on sys.path so tests can `import entities` /
# `import combat` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygamine"]
testpaths = ["tests"]

[tool.coverage.run]
# pygamine is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. "src" alone finds the flat top-level files (game.py, entities.py,
# ...) but coverage.py's static discovery of *unexecuted* files doesn't
# reliably recurse into subdirectories, so src/util is listed separately.
# omit is needed now that tests actually construct Application/GameObject
# (Game(), Cursor()) -- without it, pygamine's own modules get pulled into
# this app's report the moment they're imported, contrary to the comment
# above (previously masked only because no test happened to exercise them).
source = ["src", "src/util"]
omit = ["src/pygamine/*"]
